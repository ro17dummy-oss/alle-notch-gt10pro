name: Build Wall-E Notch APK (Infinix GT 10 Pro)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release Signed APK
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-error-log
          cp build.log compile_error.txt
          git add compile_error.txt
          git commit -m "ci: capture compilation error log" || true
          git push -f origin build-error-log || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Wall-E Notch Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wall-E-Notch-GT10Pro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Wall-E Notch Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wall-E-Notch-GT10Pro-Release-APK
          path: app/build/outputs/apk/release/*.apk
